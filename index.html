<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz Día del Trabajador, Diana!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ffccf9, #ffe6f0);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #ff1493;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 10px;
      text-shadow: 1px 1px 5px white;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 20px;
    }

    img {
      width: 80%;
      max-width: 300px;
      border-radius: 20px;
      margin: 15px auto;
      box-shadow: 0 0 15px #ff69b4;
      display: block;
    }

    .glitter {
      animation: sparkle 2s infinite ease-in-out;
    }

    @keyframes sparkle {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.5); }
    }

    footer {
      font-size: 0.9em;
      margin-top: 40px;
      color: #d63384;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="glitter">🐾 ¡Feliz Día del Trabajador, Diana! 💼💖</h1>
    <p>Gracias por ser tan trabajadora... mejor ahora, oliento rico y siendo fabulosa 😹💅</p>
    <img src="https://i.pinimg.com/originals/31/a7/2a/31a72afda250825d993400c3ef28c55c.gif" alt="Gatito 1" />
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQdJt2W9taUxTx79Mqnj8wFUkastbm3VhqalA&s" alt="Gatito 2" />
    <img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" alt="Gatito 3" />
    <p class="glitter">¡Que tengas un día tan hermoso como tú! 🌸✨</p>
    <footer>Hecho con mucho cariño y gatos por tu mejor amigo 🐱💖</footer>
  </div>
</body>
</html>
